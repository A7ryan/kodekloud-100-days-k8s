apiVersion: v1
kind: Pod
metadata:
  name: volume-share-devops
  labels:
    name: volume-share-devops
spec:
  containers:
  - name: volume-container-devops-1
    image: ubuntu:latest
    volumeMounts:
    - mountPath: /tmp/blog
      name: volume-share
    command: ["sleep", "infinity"]
    resources:
      limits:
        memory: "256Mi"
        cpu: "500m"
  - name: volume-container-devops-2
    image: ubuntu:latest
    volumeMounts:
    - mountPath: /tmp/cluster
      name: volume-share
    command: ["sleep", "infinity"]
    resources:
      limits:
        memory: "256Mi"
        cpu: "500m"
  volumes:
  - name: volume-share
    emptyDir:
      sizeLimit: 40Mi
      medium: Memory